<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rep Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#14161a;
  --surface:#1b1e24;
  --surface-2:#23272f;
  --surface-3:#2a2f38;
  --border:#2b303a;
  --border-soft:#22262e;
  --text:#e9eaed;
  --text-dim:#9297a3;
  --text-faint:#5b606b;
  --accent:#d9a441;
  --accent-soft:#4a3d22;
  --accent-text:#1a1508;
  --danger:#c0574a;
  --danger-soft:#3a2320;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{text-wrap:balance;margin:0;}
button{font-family:inherit;}
input{font-family:inherit;}
[hidden]{display:none !important;}

.btn{
  border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;
  cursor:pointer;white-space:nowrap;
}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn-accent{background:var(--accent);color:var(--accent-text);}
.btn-accent:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--surface-2);color:var(--text);}
.btn-ghost:hover{background:var(--surface-3);}

/* --- login --- */
.login-wrap{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.login-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:32px 30px;
  width:100%;
  max-width:340px;
  display:flex;flex-direction:column;gap:18px;
}
.login-card h1{
  font-family:'Archivo',sans-serif;font-weight:800;font-size:24px;letter-spacing:-0.01em;
}
.login-card p{color:var(--text-dim);font-size:13px;margin:0;}
.login-field{display:flex;flex-direction:column;gap:6px;}
.login-field label{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--text-faint);
}
.login-field input{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:9px;padding:11px 12px;font-size:14px;
}
.login-field input:focus{outline:none;border-color:var(--accent);}
.login-error{
  color:#e6b3ac;background:var(--danger-soft);border:1px solid #4a2c27;
  border-radius:9px;padding:9px 12px;font-size:12.5px;
}

/* --- app shell --- */
.app-shell{max-width:1400px;margin:0 auto;padding:32px 24px 90px;}
.masthead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;gap:12px;flex-wrap:wrap;}
.masthead h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.01em;}
.masthead-right{display:flex;align-items:center;gap:12px;}
.user-badge{
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);
  display:flex;align-items:center;gap:6px;
}
.user-badge .role-tag{
  font-size:9.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:2px 6px;
}
.signout-btn{
  background:none;border:none;color:var(--text-faint);font-size:12px;cursor:pointer;
  text-decoration:underline;padding:0;
}
.signout-btn:hover{color:var(--text-dim);}
.tagline{color:var(--text-dim);font-size:13.5px;margin:0 0 24px;}

.add-form{display:flex;gap:8px;margin-bottom:16px;}
.add-form input[type="text"]{
  flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px 14px;font-size:14.5px;min-width:0;
}
.add-form input.unit-input{flex:none;width:84px;}
.add-form input::placeholder{color:var(--text-faint);}
.add-form input:focus{outline:none;border-color:var(--accent);}

/* --- leaderboard --- */
.lb-row{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
  gap:14px;
  margin-bottom:16px;
}
.lb-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px 15px;display:flex;flex-direction:column;gap:10px;
}
.lb-title{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
  letter-spacing:0.08em;color:var(--text-faint);
}
.lb-list{display:flex;flex-direction:column;gap:8px;}
.lb-row-item{display:flex;align-items:center;gap:9px;}
.lb-rank{
  width:20px;height:20px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-family:'Archivo',sans-serif;font-weight:800;font-size:11px;
  background:var(--surface-2);color:var(--text-dim);
}
.lb-rank.r1{background:var(--accent);color:var(--accent-text);}
.lb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;}
.lb-total{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums;}
.lb-empty{color:var(--text-faint);font-size:12.5px;}
.lb-userlist{display:flex;flex-wrap:wrap;gap:6px;}
.lb-user-chip{
  background:var(--surface-2);border:1px solid var(--border);border-radius:7px;
  padding:4px 9px;font-size:12px;color:var(--text-dim);
}

/* --- stats row: charts + todo --- */
.stats-row{display:grid;grid-template-columns:1fr 280px;gap:14px;margin-bottom:16px;align-items:stretch;}
@media (max-width:860px){ .stats-row{grid-template-columns:1fr;} }
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:14px;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px 16px;display:flex;flex-direction:column;gap:14px;}
.chart-card.empty{align-items:center;justify-content:center;color:var(--text-faint);font-size:12.5px;padding:22px;text-align:center;min-height:120px;}
.chart-title{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);}
.chart-body{display:flex;flex-direction:column;align-items:center;gap:14px;}
.chart-donut-wrap{position:relative;flex:none;width:130px;height:130px;}
.chart-donut-wrap svg{display:block;width:100%;height:100%;}
.chart-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.chart-center .total{font-family:'Archivo',sans-serif;font-weight:900;font-size:21px;color:var(--text);}
.chart-center .clabel{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;}
.chart-legend{display:flex;flex-direction:column;gap:7px;width:100%;}
.chart-legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.chart-legend-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.chart-legend-name{color:var(--text);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chart-legend-pct{font-family:'IBM Plex Mono',monospace;color:var(--text-faint);font-variant-numeric:tabular-nums;font-size:11.5px;white-space:nowrap;}

.todo-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;max-height:300px;}
.todo-head h2{font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;letter-spacing:-0.005em;}
.todo-add-form{display:flex;gap:6px;}
.todo-add-form input{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 11px;font-size:13px;min-width:0;}
.todo-add-form input::placeholder{color:var(--text-faint);}
.todo-add-form input:focus{outline:none;border-color:var(--accent);}
.todo-list{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;}
.todo-item{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--border-soft);}
.todo-item:last-child{border-bottom:none;}
.todo-check{width:16px;height:16px;accent-color:var(--accent);flex:none;cursor:pointer;}
.todo-text{flex:1;font-size:13.5px;color:var(--text);min-width:0;overflow-wrap:anywhere;}
.todo-item.done .todo-text{color:var(--text-faint);text-decoration:line-through;}
.todo-empty{color:var(--text-faint);font-size:12.5px;text-align:center;padding:16px 0;}

/* --- workout list --- */
.workout-list{display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px 12px;display:flex;flex-direction:column;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.card-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;letter-spacing:-0.005em;display:flex;align-items:baseline;gap:8px;min-width:0;}
.card-title .unit-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;}
.card-title input.rename-input{background:var(--surface-2);border:1px solid var(--accent);border-radius:6px;color:var(--text);font:inherit;padding:2px 6px;width:160px;}
.icon-btn{background:transparent;border:none;color:var(--text-faint);cursor:pointer;padding:5px;border-radius:7px;display:flex;line-height:0;}
.icon-btn:hover{background:var(--surface-2);color:var(--text-dim);}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);}
.icon-btn.timer-toggle{padding:7px;}
.icon-btn.timer-toggle.running{color:var(--accent);}
.icon-btn.timer-toggle.ringing{color:var(--accent);animation:timer-pulse 1s ease-in-out infinite;}
.card-actions{display:flex;align-items:center;gap:2px;flex:none;}
.timer-live{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;padding:4px 9px;background:var(--accent-soft);border-radius:7px;margin-right:4px;}
.timer-live.ringing{animation:timer-pulse 1s ease-in-out infinite;}
.confirm-row{display:flex;align-items:center;gap:10px;background:var(--danger-soft);border:1px solid #4a2c27;border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:#e6b3ac;}
.confirm-row .spacer{flex:1;}
.link-btn{background:none;border:none;cursor:pointer;font:inherit;text-decoration:underline;padding:0;}
.today-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.today-figure{display:flex;flex-direction:column;gap:2px;}
.today-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);}
.today-value{font-family:'Archivo',sans-serif;font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;cursor:text;}
.today-value input{background:var(--surface-2);border:1px solid var(--accent);border-radius:8px;color:var(--text);font:inherit;width:120px;padding:0 6px;}
.today-breakdown{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.quick-add{display:flex;align-items:center;gap:5px;}
.chip{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);border-radius:7px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;}
.chip:hover{background:var(--surface-3);color:var(--text);}
.qty-input{width:46px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:5px 6px;font-size:12px;text-align:center;font-variant-numeric:tabular-nums;}
.qty-input:focus{outline:none;border-color:var(--accent);}
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border-soft);border:1px solid var(--border-soft);border-radius:10px;overflow:hidden;margin-bottom:4px;}
.stat{background:var(--surface-2);padding:8px 9px 8px;display:flex;flex-direction:column;gap:3px;}
.stat-label{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);}
.stat-value{font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;}
.stat-sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-faint);}
.history-toggle{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-faint);font-size:12.5px;font-weight:500;cursor:pointer;padding:10px 2px 2px;width:100%;margin-top:auto;}
.history-toggle:hover{color:var(--text-dim);}
.history-toggle svg{transition:transform .15s ease;}
.history-toggle.open svg{transform:rotate(90deg);}
.history-panel{margin-top:8px;border-top:1px solid var(--border-soft);padding-top:10px;display:flex;flex-direction:column;}
.history-row{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;font-size:13px;gap:10px;}
.history-date{font-family:'IBM Plex Mono',monospace;color:var(--text-dim);font-size:12px;}
.history-date.is-today{color:var(--accent);}
.history-right{display:flex;align-items:center;gap:7px;min-width:0;}
.history-value{font-variant-numeric:tabular-nums;font-weight:600;cursor:text;padding:2px 6px;border-radius:6px;}
.history-value:hover{background:var(--surface-2);}
.history-value input{width:64px;background:var(--surface-2);border:1px solid var(--accent);border-radius:6px;color:var(--text);font:inherit;padding:1px 5px;text-align:right;}
.history-breakdown{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.empty-state{text-align:center;padding:56px 20px 40px;color:var(--text-dim);}
.empty-state .glyph{font-family:'Archivo',sans-serif;font-weight:900;font-size:15px;letter-spacing:0.08em;color:var(--text-faint);text-transform:uppercase;margin-bottom:14px;}
.empty-state h2{font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;color:var(--text);margin:0 0 8px;}
.empty-state p{font-size:13.5px;max-width:34ch;margin:0 auto;line-height:1.5;}

.flash-overlay{position:fixed;inset:0;background:var(--accent);opacity:0;pointer-events:none;z-index:100;}
.flash-overlay.flashing{animation:flash-pulse 0.5s ease-in-out 2;}
@keyframes flash-pulse{0%,100%{opacity:0;}50%{opacity:0.4;}}

.timer-overlay{position:fixed;inset:0;background:rgba(8,9,11,0.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.timer-modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:26px 26px 24px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:18px;}
.timer-modal-head{display:flex;align-items:center;justify-content:space-between;}
.timer-modal-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);}
.timer-display{font-family:'Archivo',sans-serif;font-weight:900;font-size:64px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;color:var(--text);}
.timer-display.ringing{color:var(--accent);animation:timer-pulse 1s ease-in-out infinite;}
@keyframes timer-pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
.timer-presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.timer-presets .chip.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.timer-custom{display:flex;gap:8px;}
.timer-custom .qty-input{flex:1;width:auto;}
.timer-controls{display:flex;gap:10px;}
.timer-controls .btn{flex:1;}
</style>
</head>
<body>

<div class="flash-overlay" id="flash-overlay"></div>

<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <div>
      <h1>Rep Tracker</h1>
      <p>Sign in to your group's tracker.</p>
    </div>
    <div class="login-error" id="login-error" hidden></div>
    <form id="login-form">
      <div class="login-field" style="margin-bottom:14px;">
        <label>Username</label>
        <input type="text" id="login-username" autocomplete="username" maxlength="40" required />
      </div>
      <div class="login-field" style="margin-bottom:18px;">
        <label>Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%;">Sign in</button>
    </form>
  </div>
</div>

<div class="app-shell" id="app-screen" hidden>
  <div class="masthead">
    <h1>Rep Tracker</h1>
    <div class="masthead-right">
      <span class="user-badge"><span id="user-name"></span><span class="role-tag" id="role-tag" hidden>admin</span></span>
      <button class="signout-btn" id="signout-btn">Sign out</button>
    </div>
  </div>
  <p class="tagline">Daily counts reset at midnight. Averages track the days elapsed so far this week and month.</p>

  <form class="add-form" id="add-form" autocomplete="off" hidden>
    <input type="text" id="new-name" placeholder="Add a workout, e.g. Pull-ups" maxlength="40" />
    <input type="text" class="unit-input" id="new-unit" placeholder="reps" maxlength="10" />
    <button type="submit" class="btn btn-accent">Add</button>
  </form>

  <div class="lb-row">
    <div class="lb-card" id="lb-yesterday"></div>
    <div class="lb-card" id="lb-week"></div>
    <div class="lb-card" id="lb-month"></div>
    <div class="lb-card" id="lb-users"></div>
  </div>

  <div class="stats-row">
    <div class="chart-grid">
      <div class="chart-card" id="chart-card-today"></div>
      <div class="chart-card" id="chart-card-week"></div>
      <div class="chart-card" id="chart-card-month"></div>
    </div>
    <div class="todo-panel">
      <div class="todo-head"><h2>To-Do</h2></div>
      <form class="todo-add-form" id="todo-add-form" autocomplete="off">
        <input type="text" id="todo-input" placeholder="Add a task" maxlength="140" />
        <button type="submit" class="btn btn-accent">Add</button>
      </form>
      <div class="todo-list" id="todo-list"></div>
    </div>
  </div>

  <div class="workout-list" id="workout-list"></div>
</div>

<div class="timer-overlay" id="timer-overlay" hidden>
  <div class="timer-modal" role="dialog" aria-modal="true" aria-label="Rest timer">
    <div class="timer-modal-head">
      <span class="timer-modal-title" id="timer-modal-title">Rest Timer</span>
      <button class="icon-btn" id="timer-close" aria-label="Close timer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="timer-display" id="timer-display">1:00</div>
    <div class="timer-presets" id="timer-presets">
      <button type="button" class="chip active" data-secs="60">1:00</button>
      <button type="button" class="chip" data-secs="180">3:00</button>
      <button type="button" class="chip" data-secs="300">5:00</button>
    </div>
    <div class="timer-custom">
      <input type="number" id="timer-custom-input" class="qty-input" min="0" step="0.5" placeholder="minutes" />
      <button type="button" class="btn btn-ghost" id="timer-custom-set">Set</button>
    </div>
    <div class="timer-controls">
      <button type="button" class="btn btn-accent" id="timer-start">Start</button>
      <button type="button" class="btn btn-ghost" id="timer-reset">Reset</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
